services:
  postgres-test:
    image: postgres:15-alpine
    ports:
      - "5435:5432"
        
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: question_platform_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d question_platform_test"]
      interval: 5s
      timeout: 5s
      retries: 10
