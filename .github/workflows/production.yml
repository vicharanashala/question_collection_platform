name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - build
          - deploy

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: question-collection-prod
  REGION: asia-south1
  DOCKER_IMAGE: question-collection

jobs:
  # Production is meant to ship only what is on main, but deploys are temporarily allowed
  # from any branch while the environment is being set up.
  #
  # TO ENFORCE MAIN-ONLY: uncomment the `exit 1` line below.
  guard_branch:
    name: Check ref is main
    runs-on: ubuntu-latest
    steps:
      - name: Warn on non-main refs
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::warning::Deploying to PRODUCTION from a non-main ref: ${{ github.ref }}"
          # exit 1

  build_web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    needs: guard_branch
    # Required so environment-scoped variables (e.g. VITE_SUPPORT_EMAIL) are visible to the Vite build.
    environment: production
    if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'build' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_PROD }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL || secrets.VITE_SUPPORT_EMAIL }}

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  deploy_hosting:
    name: Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build_web
    environment: production
    if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'deploy' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reuses the bundle built by build_web so Hosting and Cloud Run always serve the
      # same frontend build.
      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_GH_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          target: production
          channelId: live
          entryPoint: .

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build_web
    if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'build' }}
    outputs:
      sha: ${{ steps.generate-tags.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: backend/web/dist

      - name: Generate image tags
        id: generate-tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:production
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:production-${{ steps.generate-tags.outputs.short_sha }}

  deploy_production:
    name: Deploy to Cloud Run (Production)
    needs: build
    runs-on: ubuntu-latest
    # Attach required reviewers / deployment protection rules to this GitHub Environment.
    environment: production
    if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'deploy' }}

    steps:
      # gcloud reports an empty --service-account as a confusing argument-parsing
      # error, and a placeholder bucket name only surfaces at runtime. Fail here with
      # a message that names the setting instead.
      - name: Validate production configuration
        env:
          RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SA_PROD || vars.GCP_RUNTIME_SA_PROD }}
          MONGODB_URL: ${{ secrets.MONGODB_URL_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
        run: |
          fail=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1 is not set"
              fail=1
            fi
          }
          require "GCP_RUNTIME_SA_PROD (secret or variable)" "$RUNTIME_SA"
          require "secrets.MONGODB_URL_PROD" "$MONGODB_URL"
          require "secrets.JWT_SECRET_PROD" "$JWT_SECRET"
          require "vars.GCP_BUCKET_NAME" "$BUCKET_NAME"

          if [ -n "$BUCKET_NAME" ] && [ "$BUCKET_NAME" = "GCP_BUCKET_NAME" ]; then
            echo "::error::vars.GCP_BUCKET_NAME holds the literal string 'GCP_BUCKET_NAME' — set it to the bucket name, e.g. annam-annadatha"
            fail=1
          fi
          if [ -n "$JWT_SECRET" ] && [ ${#JWT_SECRET} -lt 32 ]; then
            echo "::error::secrets.JWT_SECRET_PROD must be at least 32 characters — the app refuses to boot otherwise"
            fail=1
          fi
          exit $fail

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_GH_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:production-${{ needs.build.outputs.sha }}
          project_id: ${{ env.PROJECT_ID }}
          # Dedicated runtime identity. It needs storage.objectAdmin on the media bucket
          # and iam.serviceAccountTokenCreator on itself so V4 URL signing works without
          # a private key on disk.
          flags: --allow-unauthenticated --service-account=${{ secrets.GCP_RUNTIME_SA_PROD || vars.GCP_RUNTIME_SA_PROD }}
          env_vars: |
            NODE_ENV=production
            MONGODB_URL=${{ secrets.MONGODB_URL_PROD }}
            ANVESHAN_DB_URL=${{ secrets.ANVESHAN_DB_URL_PROD }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS_PROD }}
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
            OTP_DEV_BYPASS=false
            REDIS_ENABLED=false
            THROTTLE_ENABLED=true
            OTP_RATE_LIMIT=true
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ vars.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DB=${{ vars.REDIS_DB }}
            REDIS_TLS=${{ vars.REDIS_TLS }}
            SMS_PROVIDER=bsnl
            BRPS_BASE_URL=${{ vars.BRPS_BASE_URL }}
            BRPS_SERVICE_ID=${{ secrets.BRPS_SERVICE_ID }}
            BRPS_USERNAME=${{ secrets.BRPS_USERNAME }}
            BRPS_PASSWORD=${{ secrets.BRPS_PASSWORD }}
            BRPS_ENTITY_ID=${{ secrets.BRPS_ENTITY_ID }}
            BRPS_HEADER=${{ vars.BRPS_HEADER }}
            BRPS_TEMPLATE_ID=${{ secrets.BRPS_TEMPLATE_ID }}
            BRPS_TOKEN_ID=${{ vars.BRPS_TOKEN_ID }}
            SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_BUCKET_NAME=${{ vars.GCP_BUCKET_NAME }}
            GCP_STORAGE_PREFIX=production
            GCP_STORAGE_CLASS=NEARLINE
            PINELABS_ENV=production
            PINELABS_MERCHANT_ID=${{ secrets.PINELABS_MERCHANT_ID }}
            PINELABS_CLIENT_ID=${{ secrets.PINELABS_CLIENT_ID }}
            PINELABS_CLIENT_SECRET=${{ secrets.PINELABS_CLIENT_SECRET }}
            PINELABS_MOCK_VERIFICATION=false
            RAZORPAY_API_KEY=${{ secrets.RAZORPAY_API_KEY }}
            RAZORPAY_SECRET=${{ secrets.RAZORPAY_SECRET }}
            RAZORPAY_ENV=production
            RAZORPAY_ACCOUNT_NUMBER=${{ secrets.RAZORPAY_ACCOUNT_NUMBER }}
            RAZORPAY_MOCK_VERIFICATION=false
            PAYMENT_DETAILS_ENCRYPTION_KEY=${{ secrets.PAYMENT_DETAILS_ENCRYPTION_KEY }}
            VM_SERVER_URL=${{ secrets.VM_SERVER_URL }}
            GEMMA_PORT=${{ vars.GEMMA_PORT }}
            GEMMA_API_KEY=${{ secrets.GEMMA_API_KEY }}
            GEMMA_VERSION=${{ vars.GEMMA_VERSION }}
            GEMMA_MODEL=${{ vars.GEMMA_MODEL }}
            REVIEWER_URI=${{ secrets.REVIEWER_URI }}
            GDB_PORT=${{ vars.GDB_PORT }}
            GDB_API_KEY=${{ secrets.GDB_API_KEY }}
            EMBED_PORT=${{ vars.EMBED_PORT }}
            USE_VM_PROXY=true
            TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }}
            TS_HOSTNAME=annadatha-cloudrun-prod
            PROXY=${{ secrets.PROXY }}
            WEB_DIST_PATH=/app/web/dist
          env_vars_update_strategy: overwrite
